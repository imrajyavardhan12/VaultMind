name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish (for example, v0.2.0)
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Validate and build distributions
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
    steps:
      - name: Validate release tag format
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must match vX.Y.Z; received: $RELEASE_TAG" >&2
            exit 1
          fi

      - name: Check out exact release tag
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag || github.event.release.tag_name }}
          persist-credentials: false

      - name: Verify checkout and version consistency
        shell: bash
        run: |
          TAG_COMMIT="$(git rev-list -n 1 "refs/tags/$RELEASE_TAG")"
          test "$(git rev-parse HEAD)" = "$TAG_COMMIT"
          RELEASE_TAG="$RELEASE_TAG" python - <<'PY'
          import ast
          import os
          import tomllib
          from pathlib import Path

          tag_version = os.environ["RELEASE_TAG"].removeprefix("v")
          project_version = tomllib.loads(
              Path("pyproject.toml").read_text(encoding="utf-8")
          )["project"]["version"]
          module = ast.parse(Path("src/vaultmind/__init__.py").read_text(encoding="utf-8"))
          runtime_version = next(
              ast.literal_eval(node.value)
              for node in module.body
              if isinstance(node, ast.Assign)
              and any(
                  isinstance(target, ast.Name) and target.id == "__version__"
                  for target in node.targets
              )
          )
          if len({tag_version, project_version, runtime_version}) != 1:
              raise SystemExit(
                  "Version mismatch: "
                  f"tag={tag_version}, project={project_version}, runtime={runtime_version}"
              )
          PY

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Set up uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2

      - name: Build wheel and source distribution once
        run: uv build

      - name: Smoke-test installed wheel CLI
        shell: bash
        run: |
          EXPECTED_VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          python -m venv /tmp/vaultmind-release-test
          /tmp/vaultmind-release-test/bin/pip install dist/*.whl
          test "$(/tmp/vaultmind-release-test/bin/vm version)" = "VaultMind v${EXPECTED_VERSION}"

      - name: Retain built distributions
        uses: actions/upload-artifact@v7
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish distributions to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/vaultmind
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download verified distributions
        uses: actions/download-artifact@v8
        with:
          name: python-distributions
          path: dist/

      - name: Publish distributions with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
