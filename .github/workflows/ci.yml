name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    name: Quality Gates
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --locked --group dev

      - name: Ruff
        run: uv run ruff check

      - name: Mypy
        run: uv run mypy src/vaultmind

      - name: Pytest
        run: uv run pytest

      - name: Build wheel and source distribution
        run: uv build

      - name: Smoke-test installed wheel CLI
        run: |
          EXPECTED_VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          python -m venv /tmp/vaultmind-wheel-test
          /tmp/vaultmind-wheel-test/bin/pip install dist/*.whl
          test "$(/tmp/vaultmind-wheel-test/bin/vm version)" = "VaultMind v${EXPECTED_VERSION}"

      - name: Offline 20-source evaluation
        env:
          ANTHROPIC_API_KEY: ""
          OPENAI_API_KEY: ""
        run: uv run python scripts/evaluate_fixture.py --output evaluation-report.json --check

      - name: Upload evaluation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: evaluation-report
          path: evaluation-report.json
          if-no-files-found: error
          retention-days: 14
