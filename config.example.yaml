vault_path: "/Users/you/Obsidian Vault"

folders:
  raw: "📥 Raw"
  wiki: "🗺️ Wiki"
  wiki_concepts: "🧠 Concepts"
  wiki_queries: "📊 Queries"
  wiki_inbox: "📋 Inbox"
  wiki_weekly: "📅 Weekly"
  wiki_index: "📇 Index"

ai:
  default_provider: "anthropic"
  fallback_chain: ["anthropic", "openai", "openrouter", "ollama"]
  max_tokens: 2000
  providers:
    anthropic:
      models:
        fast: "claude-sonnet-4-20250514"
        deep: "claude-opus-4-5"
    openai:
      models:
        fast: "gpt-4.1-mini"
        deep: "gpt-4.1"
    openrouter:
      # Any OpenRouter model slug can replace these durable defaults.
      # base_url: "https://openrouter.ai/api/v1"  # Optional override
      models:
        fast: "openai/gpt-4.1-mini"
        deep: "openai/gpt-4.1"
    ollama:
      base_url: "http://localhost:11434"
      models:
        fast: "llama3"
        deep: "llama3"
